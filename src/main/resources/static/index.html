<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    margin-top: 50px;
}
input, select, button {
    padding: 10px;
    margin: 10px;
}
</style>
</head>
<body>

<h2>Currency Converter</h2>

<label>Amount:</label>
<input type="number" id="amount"><br><br>

<label>From:</label>
<select id="from">
    <option value="USD">USD</option>
    <option value="INR">INR</option>
    <option value="EUR">EUR</option>
</select><br><br>

<label>To:</label>
<select id="to">
    <option value="INR">INR</option>
    <option value="USD">USD</option>
    <option value="EUR">EUR</option>
</select><br><br>

<button onclick="convert()">Convert</button>

<h3 id="result"></h3>

<script>
function convert() {
    let amount = document.getElementById("amount").value;
    let from = document.getElementById("from").value;
    let to = document.getElementById("to").value;

    fetch(`http://localhost:8080/api/currency/convert?from=${from}&to=${to}&amount=${amount}`)
        .then(response => response.text())
        .then(data => {
            document.getElementById("result").innerText = "Converted: " + data;
        })
        .catch(error => {
            console.error(error);
            alert("Error occurred");
        });
}
</script>

</body>
</html>
